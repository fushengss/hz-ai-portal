apiVersion: apps/v1
kind: Deployment
metadata:
  name: hz-ai-portal
  labels:
    app: hz-ai-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hz-ai-portal
  template:
    metadata:
      labels:
        app: hz-ai-portal
    spec:
      # 若 ACR 镜像仓库为私有，需先在集群中创建 docker-registry Secret 后取消下方注释：
      # imagePullSecrets:
      #   - name: acr-secret
      containers:
        - name: hz-ai-portal
          image: crpi-l81pfihisxunrizo.cn-hangzhou.personal.cr.aliyuncs.com/zjhr/hz-ai-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
