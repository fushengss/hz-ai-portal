apiVersion: v1
kind: Service
metadata:
  name: hz-ai-portal
  labels:
    app: hz-ai-portal
spec:
  # 默认使用 NodePort，部署后即可直接通过 http://<节点IP>:30080 访问；
  # 若仅通过 Ingress 访问，也可改为 ClusterIP（并移除 nodePort 字段）。
  type: NodePort
  selector:
    app: hz-ai-portal
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
